[project]
name = "git-credential-broker"
version = "0.2.0"
description = "Policy-enforced, single-use Git capabilities for untrusted agents"
requires-python = ">=3.12"
dependencies = ["mcp>=1.30,<2", "pydantic>=2.12,<3", "cryptography>=46", "httpx>=0.28,<1", "uvicorn>=0.35,<1"]
[project.scripts]
git-broker = "git_broker.cli:main"
git-broker-client = "git_broker.client:main"
git-broker-push = "git_broker.client:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/git_broker"]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "hypothesis>=6", "ruff>=0.12", "mypy>=1.15", "pip-audit>=2.9"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 99
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
strict = true
